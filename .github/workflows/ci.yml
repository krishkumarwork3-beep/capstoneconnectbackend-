name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: capstoneconnect
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/capstoneconnect
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/capstoneconnect_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
      - run: uv sync --frozen
      - name: Create the test database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE capstoneconnect_test"
      - name: Migrations apply, and match the models
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - name: PostgreSQL 16 client tools (the server's major version; the runner's default is newer)
        run: |
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-16
          /usr/lib/postgresql/16/bin/pg_restore --version
      - name: Tests
        run: uv run pytest -q --ignore=tests/attacks
      - name: Attack tests (fuzzing, injection, auth, sessions, races, SSRF, uploads, abuse)
        run: uv run pytest -q tests/attacks --ignore-glob="tests/attacks/test_ws_*.py" --ignore=tests/attacks/test_websocket.py
      - name: WebSocket attack tests (frames fuzz, schemas, IDOR, sessions, ticket, heartbeat, backpressure, limits)
        run: uv run pytest -q tests/attacks/test_websocket.py tests/attacks/test_ws_messages.py tests/attacks/test_ws_schema.py tests/attacks/test_ws_access.py tests/attacks/test_ws_sessions.py tests/attacks/test_ws_hardening.py tests/attacks/test_ws_final.py
      - name: No known vulnerabilities in runtime dependencies (fails on any finding)
        run: |
          uv export --frozen --no-dev --no-hashes --format requirements-txt > requirements-audit.txt
          uvx pip-audit==2.9.0 -r requirements-audit.txt --no-deps --disable-pip --strict
      - name: Unsafe-settings check works (exits 1 on this CI's development settings)
        run: "! uv run python -m app.check_config"
      - name: The image builds
        run: docker build -t capstoneconnect-api .
