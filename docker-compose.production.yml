# A production-like stack on one machine (a VPS): PostgreSQL + the API, with uploads on a volume.
# Put a TLS reverse proxy (Caddy, nginx, the host's load balancer) in front of port 8000.
#
#   cp .env.production.example .env.production   # then fill it in
#   docker compose -f docker-compose.production.yml --env-file .env.production up -d --build
#
# On managed hosts (Render, Railway, Fly.io …) use the Dockerfile with the host's own PostgreSQL
# instead; this file is only for running both yourself.
services:
  db:
    image: postgres:16.9
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-capstoneconnect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-capstoneconnect}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-capstoneconnect}"]
      interval: 5s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-capstoneconnect}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-capstoneconnect}
      UPLOAD_DIR: /data/uploads
      # Unsafe settings stop the API instead of being warnings (app/check_config.py).
      APP_ENV: production
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000" # only the reverse proxy on this machine reaches it
    volumes:
      - uploads:/data/uploads

volumes:
  pgdata:
  uploads:
