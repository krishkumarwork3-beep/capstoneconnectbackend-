[project]
name = "capstoneconnect-backend"
version = "0.1.0"
description = "FastAPI + PostgreSQL backend for CapstoneConnect"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy==2.1.8",
    "psycopg[binary]==3.3.7",
    "alembic==1.20.1",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "pyjwt==2.15.1",
    "bcrypt==5.0.0",
    "httpx==0.28.1",
    "python-multipart==0.0.33",
    "boto3==1.43.123",
    "pillow==13.0.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pgserver==0.1.4",
    "moto[s3]==5.2.5",
    "schemathesis==4.33.0",
    "hypothesis==6.170.14",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:logging"  # the suite checks the app's own log handlers; pytest's capture handlers would sit beside them
