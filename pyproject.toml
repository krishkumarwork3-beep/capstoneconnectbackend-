[project]
name = "capstoneconnect-backend"
version = "0.1.0"
description = "FastAPI + PostgreSQL backend for CapstoneConnect"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "boto3>=1.43.123",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pgserver>=0.1.4",
    "moto[s3]>=5.2.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
